<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detektif Grid: Misteri Vila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>
<div class="app">
  <div class="hdr">
    <span class="hexw"><button class="hex" id="backBtn" aria-label="Daftar kasus"></button></span>
    <div class="ttl" id="caseName">–<small id="caseSub"></small></div>
    <span class="hexw"><button class="hex" id="setBtn" aria-label="Pengaturan"></button></span>
  </div>
  <div class="bar">
    <button class="sq" id="undoBtn" aria-label="Batalkan"></button>
    <button class="sq" id="redoBtn" aria-label="Ulangi"></button>
    <div class="score">Skor <b id="score">0</b><span class="t" id="timer">00:00</span></div>
    <button class="sq" id="eraseBtn" aria-label="Penghapus"></button>
    <button class="sq" id="resetBtn" aria-label="Mulai ulang"></button>
  </div>

  <div class="boardWrap"><div class="frame" id="frame">
    <div class="axis axT" id="axTop"></div>
    <div class="axis axL" id="axLeft"></div>
    <div class="board" id="board"></div>
    <div class="tip" id="tip"></div>
  </div></div>

  <div class="actions">
    <span class="hexw" id="hintW"><button class="hex blue" id="hintBtn" aria-label="Bantuan" style="position:relative"></button></span>
    <button class="rnd y" id="penBtn" aria-label="Mode pensil (simulasi)"><span class="em">✏️</span></button>
    <button class="rnd g" id="checkBtn" aria-label="Selidiki"></button>
    <button class="rnd r" id="markBtn" aria-label="Mode tanda X"></button>
    <span class="hexw"><button class="hex" id="helpBtn" aria-label="Aturan"></button></span>
  </div>

  <div class="carousel">
    <div class="track" id="track"></div>
    <button class="chev l" id="chevL" aria-label="Geser ke kiri">‹</button>
    <button class="chev" id="chevR" aria-label="Geser ke kanan">›</button>
  </div>

  <div class="cluePanel">
    <div class="tab">Keterangan!</div>
    <div class="clueBox" id="clueBox"></div>
  </div>
</div>

<div class="banner" id="banner"><span class="n" id="bnN">1</span><span class="tx" id="bnT"></span></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="src/data/floors.js"></script>
<script src="src/data/levels.js"></script>
<script src="src/js/engine.js"></script>
<script src="src/js/generator.js"></script>
<script src="src/js/audio.js"></script>
<script src="src/js/router.js"></script>
<script src="src/js/ui.js"></script>
</body>
</html>
